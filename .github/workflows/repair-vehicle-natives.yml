name: Repair vehicle natives

on:
  push:
    branches:
      - feature/online-vehicle-spawner

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch vehicle natives and back key
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              '0xB5AD06DDA85E2E8FULL': '0x1F2AA07F00B3217AULL',
              '0x5B59C12A02157D00ULL': '0xE38E9162A2500646ULL',
              '0x8450270DC5896D39ULL': '0x6AF0636DDEDCB6DDULL',
              '0xF5501FF9869DAC7CULL': '0x2A1F4F37F95BAD08ULL',
              '0xE33678A9AE50A01BULL': '0x487EB21CC7295BA1ULL',
              '0xA5277ECCD081FCC1ULL': '0x43FEB945EE7F85B8ULL',
              '0x941B1F179D6AE19AULL': '0x816562BADFDEC83EULL',
              '0xBB361D7264AC4FD8ULL': '0x2036F561ADD12E33ULL',
              '0xC0C8E6AAA00F1A58ULL': '0xF40DD601A65F7F19ULL',
              '0x77B012A683295B6EULL': '0x6089CDF6A57F326CULL',
              '0xE62930EC6FAABCA5ULL': '0x2AA720E4287BF269ULL',
              '0xEAB8A43F6621850FULL': '0x8E0A582209A62695ULL',
              '0x5DA0536AEAD1FF31ULL': '0xB5BA80F839791C0FULL',
              '0x89D1FDCA3735A1E0ULL': '0xE41033B25D003A07ULL',
              '0xD772F6AA66750D2BULL': '0x7EE3A3C5E4A40CC9ULL',
              '0x579FA5568DE0C2A0ULL': '0x1262D55792428154ULL',
              '0x439C904840715871ULL': '0xEB9DC3C7D8596C46ULL',
          }

          backend = Path('src/backend/BackendCore.cpp')
          text = backend.read_text(encoding='utf-8')
          for old, new in replacements.items():
              text = text.replace(old, new)
          backend.write_text(text, encoding='utf-8', newline='')

          renderer = Path('src/runtime/Dx12Renderer.cpp')
          text = renderer.read_text(encoding='utf-8')
          text = text.replace(
              'if (pressed(VK_NUMPAD0) || pressed(VK_INSERT) || pressed(VK_BACK))',
              'if (pressed(VK_NUMPAD0))')
          text = text.replace(
              'Numpad 5 selects, Numpad 0 goes back',
              'Numpad 5 selects, Numpad 0 goes back')
          renderer.write_text(text, encoding='utf-8', newline='')

          controls = Path('src/ui/menu/categories/menu_settings/Controls.hpp')
          text = controls.read_text(encoding='utf-8')
          text = text.replace('controls.AddLabel("Backspace - Back (alternate)");\n', '')
          if 'controls.AddLabel("Numpad 0 - Back");' not in text:
              text = text.replace('controls.AddLabel("Numpad 5 - Select");\n', 'controls.AddLabel("Numpad 5 - Select");\n        controls.AddLabel("Numpad 0 - Back");\n')
          controls.write_text(text, encoding='utf-8', newline='')

      - name: Commit repairs and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-vehicle-natives.yml
          git add src/backend/BackendCore.cpp src/runtime/Dx12Renderer.cpp src/ui/menu/categories/menu_settings/Controls.hpp
          git commit -m "Fix vehicle paint natives and Numpad 0 back"
          git push origin HEAD:feature/online-vehicle-spawner
