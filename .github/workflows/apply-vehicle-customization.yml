name: Apply Vehicle Customization Upgrade

on:
  push:
    branches: [ "feature/online-vehicle-spawner" ]
    paths:
      - ".github/sick-stage/**"
      - ".github/workflows/apply-vehicle-customization.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/online-vehicle-spawner
          fetch-depth: 0

      - name: Apply validated patch
        run: python3 .github/sick-stage/apply_vehicle_customization.py

      - name: Validate patch
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'src/ui/menu/Menu.cpp': ['return (*sharedValues)[index];'],
              'src/ui/menu/ImGuiMenuBackend.hpp': ['backAlternate', 'ImGuiKey_Insert'],
              'src/backend/BackendCore.cpp': ['CustomizeCurrentVehicle', '0xB5AD06DDA85E2E8F', 'MaxVehicle'],
              'src/ui/menu/SickMenu.cpp': ['BuildVehicleCustomizationPages', 'Apply Neon Color', 'Max Vehicle'],
              'src/frontend/FrontendCore.cpp': ['callbacks.customizeVehicle'],
          }
          for filename, needles in checks.items():
              body = Path(filename).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in body, f'{needle} missing from {filename}'
          print('patch validation passed')
          PY

      - name: Remove staging files
        run: |
          rm -rf .github/sick-stage
          rm -f .github/workflows/apply-vehicle-customization.yml

      - name: Commit and push source changes
        run: |
          git config user.name "The Devil Made Me Do It"
          git config user.email "156120260+Grim-Reaper-14@users.noreply.github.com"
          git add -- \
            src/ui/menu/Menu.cpp \
            src/ui/menu/ImGuiMenuBackend.hpp \
            src/backend/BackendTypes.hpp \
            src/backend/BackendCore.hpp \
            src/backend/BackendCore.cpp \
            src/backend/BackendApi.hpp \
            src/backend/BackendApi.cpp \
            src/ui/menu/SickMenu.hpp \
            src/ui/menu/SickMenu.cpp \
            src/frontend/FrontendCore.cpp \
            tests/menu_tests.cpp \
            .github/sick-stage/apply_vehicle_customization.py \
            .github/workflows/apply-vehicle-customization.yml
          git diff --cached --check
          git commit -m "Add vehicle customization editor"
          git push origin HEAD:feature/online-vehicle-spawner
