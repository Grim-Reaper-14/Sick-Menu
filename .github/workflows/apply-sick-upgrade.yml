name: Apply Sick Menu Upgrade

on:
  push:
    branches:
      - feature/online-vehicle-spawner
    paths:
      - .github/sick-upgrade/**
      - .github/workflows/apply-sick-upgrade.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/online-vehicle-spawner
          fetch-depth: 0

      - name: Rebuild validated upgrade bundle
        shell: bash
        run: |
          cat \
            .github/sick-upgrade/part00.b64 \
            .github/sick-upgrade/part01.b64 \
            .github/sick-upgrade/s00.b64 \
            .github/sick-upgrade/s01.b64 \
            .github/sick-upgrade/s02.b64 \
            .github/sick-upgrade/s03.b64 \
            .github/sick-upgrade/s04.b64 \
            | base64 -d > /tmp/sick-menu-online-upgrade.zip
          rm -rf /tmp/sick-menu-online-upgrade
          unzip -q /tmp/sick-menu-online-upgrade.zip -d /tmp
          python3 /tmp/sick-menu-online-upgrade/apply_sick_menu_upgrade.py .

      - name: Validate catalog and patch
        shell: bash
        run: |
          g++ -std=c++20 -Isrc /tmp/sick-menu-online-upgrade/catalog_smoke.cpp -o /tmp/catalog_smoke
          /tmp/catalog_smoke
          git diff --check

      - name: Commit and push upgrade
        shell: bash
        run: |
          git config user.name "The Devil Made Me Do It"
          git config user.email "156120260+Grim-Reaper-14@users.noreply.github.com"
          rm -rf .github/sick-upgrade
          rm -f .github/workflows/apply-sick-upgrade.yml
          git add -- \
            src/backend/BackendTypes.hpp \
            src/backend/BackendCore.hpp \
            src/backend/BackendCore.cpp \
            src/backend/BackendApi.hpp \
            src/backend/BackendApi.cpp \
            src/frontend/FrontendCore.cpp \
            src/game/enhanced/EnhancedScriptHost.hpp \
            src/game/enhanced/EnhancedScriptHost.cpp \
            src/game/natives/Natives.hpp \
            src/game/natives/generated/NativeIndex.hpp \
            src/game/natives/generated/NativeHashes.hpp \
            src/game/natives/generated/EnhancedNativeHashes.hpp \
            src/ui/menu/SickMenu.hpp \
            src/ui/menu/SickMenu.cpp \
            src/ui/menu/categories/online_vehicle_spawner/VehicleCatalog.hpp \
            tests/menu_tests.cpp \
            tests/enhanced_script_host_tests.cpp
          git add -u -- .github/sick-upgrade .github/workflows/apply-sick-upgrade.yml
          git diff --cached --check
          git commit -m "Expand online vehicle and session features"
          git push origin HEAD:feature/online-vehicle-spawner
