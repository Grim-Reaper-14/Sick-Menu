name: MSVC Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_PLATFORM: x64

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies and configure Visual Studio 2026 x64
        run: >-
          cmake -S . -B build
          -G "Visual Studio 18 2026"
          -A ${{ env.BUILD_PLATFORM }}
          -DSICK_MENU_BUILD_DLL=ON
          -DSICK_NATIVE_BUILD_TESTS=ON

      - name: Build with MSVC and show warnings
        run: cmake --build build --config ${{ matrix.configuration }} --parallel --verbose

      - name: Run tests
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure --timeout 45

      - name: Validate DLL artifact
        shell: pwsh
        run: |
          $dll = "build/bin/${{ matrix.configuration }}/SickMenu.dll"
          if (-not (Test-Path $dll -PathType Leaf)) {
            throw "Expected artifact was not produced: $dll"
          }
          if ((Get-Item $dll).Length -eq 0) {
            throw "Artifact is empty: $dll"
          }
          Get-Item $dll | Format-List FullName, Length, LastWriteTime

      - name: Upload DLL artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: SickMenu-${{ matrix.configuration }}-${{ env.BUILD_PLATFORM }}
          path: build/bin/${{ matrix.configuration }}/SickMenu.dll
          if-no-files-found: error
