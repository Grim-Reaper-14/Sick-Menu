name: MSVC Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Visual Studio 2022 x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSICK_NATIVE_BUILD_TESTS=ON

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build with MSVC
        run: msbuild build\SickMenu.sln /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=x64

      - name: Run tests
        run: ctest --test-dir build -C ${{ env.BUILD_CONFIGURATION }} --output-on-failure
